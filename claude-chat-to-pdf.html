<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Chat to PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { max-width: 600px; width: 100%; }
        .card { background: rgba(255,255,255,0.08); border-radius: 20px; padding: 40px; border: 1px solid rgba(255,255,255,0.1); }
        h1 { color: #fff; font-size: 2rem; text-align: center; margin-bottom: 10px; }
        .subtitle { color: #888; text-align: center; margin-bottom: 30px; }
        .input-group { margin-bottom: 25px; }
        .input-group label { display: block; color: #aaa; margin-bottom: 8px; font-size: 0.9rem; }
        .input-group input { width: 100%; padding: 15px; border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; background: rgba(0,0,0,0.3); color: #fff; font-size: 1rem; transition: border-color 0.3s; }
        .input-group input:focus { outline: none; border-color: #3498db; }
        .input-group input::placeholder { color: #555; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(231,76,60,0.4); }
        .btn-primary:disabled { background: #444; cursor: not-allowed; transform: none; box-shadow: none; }
        .status { margin-top: 20px; padding: 15px; border-radius: 10px; text-align: center; display: none; }
        .status.loading { display: block; background: rgba(52,152,219,0.2); border: 1px solid #3498db; color: #3498db; }
        .status.success { display: block; background: rgba(39,174,96,0.2); border: 1px solid #27ae60; color: #27ae60; }
        .status.error { display: block; background: rgba(231,76,60,0.2); border: 1px solid #e74c3c; color: #e74c3c; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #3498db; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .help { margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .help p { color: #666; font-size: 0.85rem; text-align: center; }
        .preview { margin-top: 20px; max-height: 300px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 15px; display: none; }
        .preview.show { display: block; }
        .message { margin-bottom: 15px; padding: 12px; border-radius: 8px; }
        .message.human { background: rgba(52,152,219,0.2); border-left: 3px solid #3498db; }
        .message.assistant { background: rgba(231,76,60,0.2); border-left: 3px solid #e74c3c; }
        .message-role { font-weight: bold; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 5px; }
        .message.human .message-role { color: #3498db; }
        .message.assistant .message-role { color: #e74c3c; }
        .message-content { color: #ccc; font-size: 0.9rem; white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Claude Chat to PDF</h1>
            <p class="subtitle">共有リンクからPDFを生成</p>

            <div class="input-group">
                <label>共有リンクURL</label>
                <input type="url" id="urlInput" placeholder="https://claude.ai/share/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
            </div>

            <button class="btn btn-primary" id="exportBtn" onclick="convertToPDF()">PDFとして出力</button>

            <div id="status" class="status"></div>
            <div id="preview" class="preview"></div>

            <div class="help">
                <p>Claudeの共有チャットURL（claude.ai/share/...）を貼り付けて、ボタンを押すだけ！</p>
            </div>
        </div>
    </div>

    <script>
        const CORS_PROXIES = [
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?'
        ];

        async function convertToPDF() {
            const url = document.getElementById('urlInput').value.trim();
            const status = document.getElementById('status');
            const preview = document.getElementById('preview');
            const btn = document.getElementById('exportBtn');

            if (!url) {
                showStatus('error', 'URLを入力してください');
                return;
            }

            if (!url.includes('claude.ai/share/')) {
                showStatus('error', 'claude.ai/share/ のURLを入力してください');
                return;
            }

            btn.disabled = true;
            showStatus('loading', '<span class="spinner"></span>チャットを取得中...');
            preview.className = 'preview';

            try {
                const html = await fetchWithProxy(url);
                const messages = parseChat(html);

                if (messages.length === 0) {
                    showStatus('error', 'チャットの取得に失敗しました。URLを確認してください。');
                    btn.disabled = false;
                    return;
                }

                showPreview(messages);
                showStatus('loading', '<span class="spinner"></span>PDFを生成中...');

                await new Promise(r => setTimeout(r, 300));
                generatePDF(messages);

                showStatus('success', 'PDFをダウンロードしました！ (' + messages.length + 'メッセージ)');
            } catch (err) {
                console.error(err);
                showStatus('error', '取得に失敗しました: ' + err.message);
            }

            btn.disabled = false;
        }

        async function fetchWithProxy(url) {
            for (const proxy of CORS_PROXIES) {
                try {
                    const res = await fetch(proxy + encodeURIComponent(url));
                    if (res.ok) {
                        return await res.text();
                    }
                } catch (e) {
                    continue;
                }
            }
            throw new Error('プロキシ経由での取得に失敗しました');
        }

        function parseChat(html) {
            const messages = [];
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');

            // Method 1: data-testid属性から取得
            doc.querySelectorAll('[data-testid*="message"]').forEach(el => {
                const testId = el.getAttribute('data-testid') || '';
                const role = testId.includes('human') || testId.includes('user') ? 'human' : 'assistant';
                const content = el.innerText.trim();
                if (content && content.length > 0) {
                    messages.push({ role, content });
                }
            });

            // Method 2: クラス名から取得
            if (messages.length === 0) {
                doc.querySelectorAll('[class*="human"], [class*="user"], [class*="assistant"], [class*="claude"]').forEach(el => {
                    const cls = el.className || '';
                    const isHuman = cls.includes('human') || cls.includes('user');
                    const content = el.innerText.trim();
                    if (content && content.length > 10) {
                        messages.push({ role: isHuman ? 'human' : 'assistant', content });
                    }
                });
            }

            // Method 3: prose/message要素から
            if (messages.length === 0) {
                doc.querySelectorAll('.prose, [class*="message-content"]').forEach(el => {
                    const parent = el.closest('[class*="human"]') || el.closest('[class*="user"]');
                    const content = el.innerText.trim();
                    if (content && content.length > 5) {
                        messages.push({ role: parent ? 'human' : 'assistant', content });
                    }
                });
            }

            // Method 4: JSON-LDまたはscriptタグから
            if (messages.length === 0) {
                doc.querySelectorAll('script').forEach(script => {
                    const text = script.textContent || '';
                    if (text.includes('"messages"') || text.includes('"content"')) {
                        try {
                            const match = text.match(/\{[\s\S]*"messages"[\s\S]*\}/);
                            if (match) {
                                const data = JSON.parse(match[0]);
                                if (data.messages) {
                                    data.messages.forEach(m => {
                                        messages.push({ role: m.role || 'assistant', content: m.content || '' });
                                    });
                                }
                            }
                        } catch(e) {}
                    }
                });
            }

            return messages;
        }

        function showStatus(type, message) {
            const status = document.getElementById('status');
            status.className = 'status ' + type;
            status.innerHTML = message;
        }

        function showPreview(messages) {
            const preview = document.getElementById('preview');
            let html = '';
            messages.slice(0, 5).forEach(msg => {
                const shortContent = msg.content.length > 100 ? msg.content.substring(0, 100) + '...' : msg.content;
                html += '<div class="message ' + msg.role + '">';
                html += '<div class="message-role">' + (msg.role === 'human' ? 'You' : 'Claude') + '</div>';
                html += '<div class="message-content">' + escapeHtml(shortContent) + '</div>';
                html += '</div>';
            });
            if (messages.length > 5) {
                html += '<p style="color:#666;text-align:center;margin-top:10px;">... 他 ' + (messages.length - 5) + ' メッセージ</p>';
            }
            preview.innerHTML = html;
            preview.className = 'preview show';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function generatePDF(messages) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            let y = 20;
            const pageHeight = 280;
            const margin = 20;
            const lineHeight = 6;
            const maxWidth = 170;

            doc.setFontSize(16);
            doc.setTextColor(50);
            doc.text('Claude Chat Log', margin, y);
            y += 10;

            doc.setFontSize(9);
            doc.setTextColor(128);
            doc.text(new Date().toLocaleString('ja-JP'), margin, y);
            y += 12;

            doc.setFontSize(10);

            messages.forEach(msg => {
                if (y > pageHeight - 20) {
                    doc.addPage();
                    y = 20;
                }

                if (msg.role === 'human') {
                    doc.setTextColor(52, 152, 219);
                } else {
                    doc.setTextColor(192, 57, 43);
                }
                doc.setFont(undefined, 'bold');
                doc.text(msg.role === 'human' ? 'You:' : 'Claude:', margin, y);
                y += lineHeight;

                doc.setTextColor(60);
                doc.setFont(undefined, 'normal');

                const lines = doc.splitTextToSize(msg.content, maxWidth);
                lines.forEach(line => {
                    if (y > pageHeight - 10) {
                        doc.addPage();
                        y = 20;
                    }
                    doc.text(line, margin, y);
                    y += lineHeight;
                });

                y += 4;
            });

            doc.save('claude-chat.pdf');
        }

        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') convertToPDF();
        });
    </script>
</body>
</html>
